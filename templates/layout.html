<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <title>DevPulse</title>
</head>

<body>
    {% if session["user_id"] %}
    <div class="d-flex">
        <!-- Ash Sidebar -->
        <nav id="sidebar" class="d-flex flex-column">
            <div class="sidebar-heading">DevPulse</div>
            <div class="mt-3">
                <a href="/" class="nav-link-custom">Dashboard</a>
                <a href="/projects" class="nav-link-custom">Projects</a>
            </div>
            <div class="mt-auto p-3 border-top border-light">
                <p class="small text-muted mb-1">Logged in as</p>
                <p class="fw-bold mb-2">{{ session.username }}</p>
                <a href="/logout" class="text-danger text-decoration-none small">Logout</a>
            </div>
        </nav>

        <!-- White Main Content -->
        <main class="flex-grow-1 p-5">
            {% block main %}{% endblock %}
        </main>
    </div>
    {% else %}
    <div class="vh-100 d-flex align-items-center justify-content-center bg-light">
        {% block auth %}{% endblock %}
    </div>
    {% endif %}
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
